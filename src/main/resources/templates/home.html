<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MicroDiab</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.0.0/css/bootstrap.min.css}"/>
</head>

<body class="d-flex flex-column vh-100">
<!-- Header avec les informations utilisateur et logout -->
<header class="bg-primary text-white py-3 shadow-sm">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h2 class="mb-0">MicroDiab</h2>
            </div>
            <div class="col-md-6 text-md-end text-center">
                <div class="d-flex justify-content-md-end justify-content-center align-items-center">
                    <div class="me-3">
                        <small class="opacity-75">Connecté en tant que:</small><br>
                        <strong th:text="${userConnected}" class="user">Username</strong>
                        <span class="badge bg-light text-primary ms-1" th:text="${userRole}">Role</span>
                    </div>
                    <form th:action="@{/logout}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Corps principal centré -->
<main class="flex-grow-1 d-flex align-items-center">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h1 class="card-title text-primary mb-4">
                            Bienvenue dans l'application MicroDiab
                        </h1>
                        <p class="card-text text-muted mb-4">
                            Gérez facilement vos patients et leurs informations médicales
                        </p>
                        <a th:href="@{/patients}" class="btn btn-primary btn-lg px-5 py-3">
                            <i class="bi bi-people-fill me-2"></i>
                            Liste des Patients
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer optionnel -->
<footer class="bg-light text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; 2025 MicroDiab - Application de gestion médicale</small>
    </div>
</footer>
</body>
</html>
