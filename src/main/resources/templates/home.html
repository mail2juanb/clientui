<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MicroDiab</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.0.0/css/bootstrap.min.css}"/>
</head>

<body class="d-flex flex-column vh-100">

<!-- Header -->
<th:block th:replace="fragments :: header"></th:block>

<!-- Corps principal centré -->
<main class="flex-grow-1 d-flex align-items-center">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h1 class="card-title text-primary mb-4">
                            Bienvenue dans l'application MicroDiab
                        </h1>
                        <p class="card-text text-muted mb-4">
                            Gérez facilement vos patients et leurs informations médicales
                        </p>
                        <a th:href="@{/patients}" class="btn btn-primary btn-lg px-5 py-3">
                            <i class="bi bi-people-fill me-2"></i>
                            Liste des Patients
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer optionnel -->
<footer class="bg-light text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; 2025 MicroDiab - Application de gestion médicale</small>
    </div>
</footer>
</body>
</html>
