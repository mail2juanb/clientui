<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MicroDiab</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.0.0/css/bootstrap.min.css}"/>
</head>

<body class="d-flex flex-column vh-100">
<!-- Header -->
<th:block th:replace="~{fragments :: header}"></th:block>

<!-- Corps principal -->
<main class="flex-grow-1 py-4">
    <div class="container">
        <h1 class="mb-4">Liste des Patients</h1>
        <div class="row">
            <div class="col-12">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                    <tr>
<!--                        <th>Id</th>-->
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Date de Naissance</th>
<!--                        <th>Genre</th>-->
<!--                        <th>Adresse</th>-->
<!--                        <th>Téléphone</th>-->
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:if="${not #lists.isEmpty(patients)}">
                        <tr th:each="patient : ${patients}">
<!--                            <td style="width: 10%" th:text="${patient.id}"></td>-->
                            <td th:text="${patient.lastname}"></td>
                            <td th:text="${patient.firstname}"></td>
                            <td th:text="${patient.dateofbirth}"></td>
<!--                            <td th:text="${patient.gender == 'M'} ? 'Homme' : (${patient.gender == 'F'} ? 'Femme' : ${patient.gender})"></td>-->
<!--                            <td th:text="${patient.address}"></td>-->
<!--                            <td th:text="${patient.phone}"></td>-->
                            <td style="width: 15%" class="text-center">
                                <a th:href="@{/update/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-primary me-1">Editer</a>
                                <a th:href="@{/delete/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-danger">Supprimer</a>
                            </td>
                        </tr>
                    </th:block>
                    <th:block th:unless="${not #lists.isEmpty(patients)}">
                        <tr>
                            <td colspan="8" class="text-center">Aucun patient à afficher</td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<th:block th:replace="~{fragments :: footer}"></th:block>

<script type="text/javascript" th:src="@{/webjars/bootstrap/5.0.0/js/bootstrap.min.js}"></script>
</body>
</html>
