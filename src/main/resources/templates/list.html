<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MicroDiab</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.0.0/css/bootstrap.min.css}"/>
</head>

<body class="d-flex flex-column vh-100">
<!-- Header -->
<th:block th:replace="~{fragments :: header}"></th:block>

<!-- Corps principal -->
<main class="flex-grow-1 py-4">
    <div class="container">
        <h1 class="mb-4 text-center">Liste des Patients</h1>
        <div class="row justify-content-center">
            <div class="col-auto">
                <table class="table table-bordered table-striped mx-auto w-auto">
                    <thead class="table-dark">
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Date de Naissance</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:if="${not #lists.isEmpty(patients)}">
                        <tr th:each="patient : ${patients}">
                            <td th:text="${patient.lastname}"></td>
                            <td th:text="${patient.firstname}"></td>
                            <td th:text="${patient.dateofbirth}"></td>
                            <td class="text-center">
                                <a th:href="@{/update/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-primary me-1">Editer</a>
                                <a th:href="@{/delete/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-danger">Supprimer</a>
                            </td>
                        </tr>
                    </th:block>
                    <th:block th:unless="${not #lists.isEmpty(patients)}">
                        <tr>
                            <td colspan="4" class="text-center">Aucun patient à afficher</td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<th:block th:replace="~{fragments :: footer}"></th:block>

<script type="text/javascript" th:src="@{/webjars/bootstrap/5.0.0/js/bootstrap.min.js}"></script>
</body>
</html>
