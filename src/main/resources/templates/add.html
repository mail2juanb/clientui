<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un patient - MicroDiab</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.0.0/css/bootstrap.min.css}"/>
</head>

<body class="d-flex flex-column vh-100">
<!-- Header -->
<th:block th:replace="~{fragments :: header}"></th:block>

<!-- Corps principal -->
<main class="flex-grow-1 py-4">
    <div class="container">
        <h1 class="mb-4 text-center">Ajouter un patient</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form th:action="@{/add/addPatient}" th:object="${patient}" method="post">
                    <div class="mb-3">
                        <label for="lastname" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="lastname" th:field="*{lastname}" required>
                    </div>
                    <div class="mb-3">
                        <label for="firstname" class="form-label">Prénom</label>
                        <input type="text" class="form-control" id="firstname" th:field="*{firstname}" required>
                    </div>
                    <div class="mb-3">
                        <label for="dateofbirth" class="form-label">Date de naissance</label>
                        <input type="date" class="form-control" id="dateofbirth" th:field="*{dateofbirth}" required>
                    </div>
                    <div class="mb-3">
                        <label for="gender" class="form-label">Genre</label>
                        <select th:field="*{gender}" id="gender" class="form-select" required>
                            <option value="" disabled selected>Sélectionnez un genre</option>
                            <option value="M">Homme</option>
                            <option value="F">Femme</option>
                        </select>
                        <p class="text-danger" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></p>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Adresse</label>
                        <input type="text" class="form-control" id="address" th:field="*{address}">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Téléphone</label>
                        <input type="text" class="form-control" id="phone" th:field="*{phone}">
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a th:href="@{/patients}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<th:block th:replace="~{fragments :: footer}"></th:block>

<script type="text/javascript" th:src="@{/webjars/bootstrap/5.0.0/js/bootstrap.min.js}"></script>
</body>
</html>
